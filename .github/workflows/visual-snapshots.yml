name: Responsive visual screenshots

on:
  pull_request:
    paths:
      - 'src/**'
      - '.github/workflows/visual-snapshots.yml'
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Chromium
        run: pnpm dlx playwright@1.56.1 install --with-deps chromium
      - name: Start local preview and confirm availability
        run: |
          pnpm preview --host 127.0.0.1 --port 4321 > /tmp/kopdes-preview.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4321/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kopdes-preview.log
          exit 1
      - name: Capture representative desktop, tablet, and mobile pages
        run: |
          mkdir -p screenshots
          pnpm dlx playwright@1.56.1 screenshot --browser=chromium --viewport-size="1440,900" --wait-for-timeout=1800 --full-page http://127.0.0.1:4321/ screenshots/home-desktop-1440.png
          pnpm dlx playwright@1.56.1 screenshot --browser=chromium --viewport-size="768,1024" --wait-for-timeout=1800 --full-page http://127.0.0.1:4321/ screenshots/home-tablet-768.png
          pnpm dlx playwright@1.56.1 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=1800 --full-page http://127.0.0.1:4321/ screenshots/home-mobile-390.png
          pnpm dlx playwright@1.56.1 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=1800 --full-page http://127.0.0.1:4321/tentang/ screenshots/history-mobile-390.png
          pnpm dlx playwright@1.56.1 screenshot --browser=chromium --viewport-size="1440,900" --wait-for-timeout=1800 --full-page http://127.0.0.1:4321/gerai/ screenshots/outlets-desktop-1440.png
          pnpm dlx playwright@1.56.1 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=1800 --full-page http://127.0.0.1:4321/daftar/ screenshots/registration-mobile-390.png
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kopdes-responsive-snapshots
          path: screenshots/*.png
          retention-days: 7
          if-no-files-found: warn
