name: Responsive visual screenshots

on:
  pull_request:
    paths:
      - 'src/**'
      - '.github/workflows/visual-snapshots.yml'
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Chromium
        run: pnpm dlx playwright@1.56.1 install --with-deps chromium
      - name: Start local preview and confirm availability
        run: |
          pnpm preview --host 127.0.0.1 --port 4321 > /tmp/kopdes-preview.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4321/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kopdes-preview.log
          exit 1
      - name: Smoke test all eight routes
        run: |
          for route in / /tujuan/ /gerai/ /keanggotaan/ /tentang/ /lokasi/ /faq/ /daftar/; do
            curl --silent --show-error --fail "http://127.0.0.1:4321$route" > /dev/null || exit 1
          done
      - name: Capture first-fold images at real viewport heights
        run: |
          mkdir -p screenshots
          pnpm dlx playwright@1.56.1 screenshot --browser=chromium --viewport-size="1000,563" --wait-for-timeout=1800 http://127.0.0.1:4321/ screenshots/home-reference-1000x563.png
          pnpm dlx playwright@1.56.1 screenshot --browser=chromium --viewport-size="1440,900" --wait-for-timeout=1800 http://127.0.0.1:4321/ screenshots/home-firstfold-1440x900.png
          pnpm dlx playwright@1.56.1 screenshot --browser=chromium --viewport-size="390,844" --wait-for-timeout=1800 http://127.0.0.1:4321/ screenshots/home-firstfold-390x844.png
          pnpm dlx playwright@1.56.1 screenshot --browser=chromium --viewport-size="320,700" --wait-for-timeout=1800 http://127.0.0.1:4321/ screenshots/home-firstfold-320x700.png
          pnpm dlx playwright@1.56.1 screenshot --browser=chromium --viewport-size="1920,1080" --wait-for-timeout=1800 http://127.0.0.1:4321/ screenshots/home-firstfold-1920x1080.png
      # Tall viewport triggers lazy below-fold photography while preserving width breakpoints.
      - name: Capture representative desktop, tablet, and mobile pages
        run: |
          mkdir -p screenshots
          pnpm dlx playwright@1.56.1 screenshot --browser=chromium --viewport-size="1440,5100" --wait-for-timeout=1800 --full-page http://127.0.0.1:4321/ screenshots/home-desktop-1440.png
          pnpm dlx playwright@1.56.1 screenshot --browser=chromium --viewport-size="768,5000" --wait-for-timeout=1800 --full-page http://127.0.0.1:4321/ screenshots/home-tablet-768.png
          pnpm dlx playwright@1.56.1 screenshot --browser=chromium --viewport-size="390,7700" --wait-for-timeout=1800 --full-page http://127.0.0.1:4321/ screenshots/home-mobile-390.png
          pnpm dlx playwright@1.56.1 screenshot --browser=chromium --viewport-size="390,7700" --wait-for-timeout=1800 --full-page http://127.0.0.1:4321/tentang/ screenshots/history-mobile-390.png
          pnpm dlx playwright@1.56.1 screenshot --browser=chromium --viewport-size="1440,900" --wait-for-timeout=1800 --full-page http://127.0.0.1:4321/gerai/ screenshots/outlets-desktop-1440.png
          pnpm dlx playwright@1.56.1 screenshot --browser=chromium --viewport-size="390,7700" --wait-for-timeout=1800 --full-page http://127.0.0.1:4321/daftar/ screenshots/registration-mobile-390.png
      - name: Validate screenshot dimensions and PNG integrity
        run: node scripts/check-visual-snapshots.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kopdes-responsive-snapshots
          path: screenshots/*.png
          retention-days: 7
          if-no-files-found: warn
