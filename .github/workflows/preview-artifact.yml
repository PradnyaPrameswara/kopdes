name: Build private preview artifact

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/preview-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm audit:rules
      - run: pnpm check
      - run: pnpm build
      - run: pnpm audit:site
      - run: pnpm audit:release
      - uses: actions/upload-artifact@v4
        with:
          name: kopdes-static-preview
          path: dist/
          retention-days: 7
          if-no-files-found: error
