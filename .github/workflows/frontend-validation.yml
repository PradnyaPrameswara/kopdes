name: Frontend validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm audit:rules
      - run: pnpm check
      - run: pnpm build
      - run: pnpm audit:site
      - run: node scripts/check-asset-budgets.mjs
      - run: pnpm audit:release
      - run: node scripts/audit-internal-links.mjs
