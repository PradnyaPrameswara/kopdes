<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" preserveAspectRatio="none" fill="none" role="img" aria-label="Motif Gelombang Merah Putih">
  <defs>
    <!-- Red gradient with warm glow -->
    <linearGradient id="mpRedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CE1126" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#B70F22" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#9E0D1D" stop-opacity="0.95" />
    </linearGradient>

    <!-- Golden accent gradient -->
    <linearGradient id="mpGoldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F2B705" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#F2B705" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#F2B705" stop-opacity="0.1" />
    </linearGradient>

    <!-- White wave fill -->
    <linearGradient id="mpWhiteGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FFF7F7" stop-opacity="0.6" />
    </linearGradient>

    <!-- Subtle diagonal geometric hatch pattern -->
    <pattern id="diagonalHatch" width="40" height="40" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="40" stroke="#CE1126" stroke-width="1.5" stroke-opacity="0.08" />
      <line x1="20" y1="0" x2="20" y2="40" stroke="#F2B705" stroke-width="1" stroke-opacity="0.1" />
    </pattern>
  </defs>

  <!-- Background Subtle Hatching -->
  <rect width="1200" height="400" fill="url(#diagonalHatch)" />

  <!-- Back Layer Flowing Wave (Dark Red / Shadow) -->
  <path d="M0,120 
           C200,60 400,180 600,110 
           C800,40 1000,160 1200,90 
           L1200,400 L0,400 Z" 
        fill="#9E0D1D" 
        opacity="0.15" />

  <!-- Middle Layer Red Wave (Brand Red) -->
  <path d="M0,160 
           C250,90 450,220 700,140 
           C950,60 1100,180 1200,130 
           L1200,400 L0,400 Z" 
        fill="url(#mpRedGradient)" 
        opacity="0.3" />

  <!-- Gold Ribbon Separator Line -->
  <path d="M0,195 
           C220,130 460,255 720,180 
           C980,105 1100,210 1200,170" 
        fill="none" 
        stroke="url(#mpGoldAccent)" 
        stroke-width="3" 
        stroke-dasharray="8 4" />

  <!-- Foreground Crisp Pure White Wave (Putih) -->
  <path d="M0,210 
           C240,150 480,270 720,195 
           C960,120 1080,225 1200,185 
           L1200,400 L0,400 Z" 
        fill="url(#mpWhiteGradient)" />

  <!-- Geometric Diamond Accents (Batik Kawung / Ketupat Inspiration) -->
  <g fill="#CE1126" opacity="0.06">
    <polygon points="150,50 165,65 150,80 135,65" />
    <polygon points="350,70 365,85 350,100 335,85" />
    <polygon points="550,40 565,55 550,70 535,55" />
    <polygon points="750,75 765,90 750,105 735,90" />
    <polygon points="950,45 965,60 950,75 935,60" />
    <polygon points="1100,70 1115,85 1100,100 1085,85" />
  </g>
</svg>
